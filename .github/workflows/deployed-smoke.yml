name: Placement Atlas deployed smoke
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Verify the deployed Placement Atlas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser testing dependency
        run: npm install --no-save playwright@1.56.1
      - name: Install test browser and dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify deployed map, vector renderer, PWA and branding
        run: node tests/map-theme-smoke.cjs
        env:
          TARGET: https://placementatlas.co.uk/
      - name: Upload deployed screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: placement-atlas-deployed-smoke
          path: /tmp/oriel-map-theme-smoke/
          if-no-files-found: ignore
          retention-days: 7
