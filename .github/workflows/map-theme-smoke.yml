name: Placement Atlas map and theme smoke
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'favicon.svg'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'map-styles/**'
      - 'locations.json'
      - 'tests/map-theme-smoke.cjs'
      - 'tests/shortlist-badge-smoke.cjs'
      - 'tests/catalogue-parser.test.cjs'
      - 'tests/independence.test.cjs'
      - 'tests/research.test.js'
      - 'tests/shortlist.test.js'
      - 'data/**'
      - '.github/workflows/map-theme-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'favicon.svg'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'map-styles/**'
      - 'locations.json'
      - 'tests/map-theme-smoke.cjs'
      - 'tests/shortlist-badge-smoke.cjs'
      - 'tests/catalogue-parser.test.cjs'
      - 'tests/independence.test.cjs'
      - 'tests/research.test.js'
      - 'tests/shortlist.test.js'
      - 'data/**'
      - '.github/workflows/map-theme-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    name: Live site maps, programme panels, themes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate independent catalogue and CSV parser
        run: node --test tests/catalogue-parser.test.cjs tests/independence.test.cjs tests/research.test.js tests/shortlist.test.js
      - name: Install browser testing dependency
        run: npm install --no-save playwright@1.56.1
      - name: Install test browser and dependencies
        run: npx playwright install --with-deps chromium
      - name: Validate live shortlist count and undo/redo
        run: node tests/shortlist-badge-smoke.cjs
      - name: Serve pull request build
        if: github.event_name == 'pull_request'
        run: python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/placement-atlas-http.log 2>&1 &
      - name: Validate deployed UI
        run: node tests/map-theme-smoke.cjs
        env:
          TARGET: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8000/' || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: oriel-map-theme-visual-checks
          path: /tmp/oriel-map-theme-smoke/
          if-no-files-found: ignore
          retention-days: 7
